services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentforge
      POSTGRES_USER: agentforge
      POSTGRES_PASSWORD: agentforge-demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentforge -d agentforge"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - agentforge-postgres:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      AGENTFORGE_ENV: production
      AGENTFORGE_DATABASE_URL: postgresql+psycopg://agentforge:agentforge-demo@db:5432/agentforge
      AGENTFORGE_CORS_ORIGINS: http://localhost:3000
      AGENTFORGE_DEMO_MODE: "true"
      AGENTFORGE_LLM_BASE_URL: ${AGENTFORGE_LLM_BASE_URL:-}
      AGENTFORGE_LLM_API_KEY: ${AGENTFORGE_LLM_API_KEY:-}
      AGENTFORGE_LLM_MODEL: ${AGENTFORGE_LLM_MODEL:-gpt-4.1-mini}
      AGENTFORGE_LLM_EMBEDDING_MODEL: ${AGENTFORGE_LLM_EMBEDDING_MODEL:-text-embedding-3-small}
      AGENTFORGE_LLM_TRUST_ENV: ${AGENTFORGE_LLM_TRUST_ENV:-false}
      AGENTFORGE_MCP_BRIDGE_URL: http://mcp-bridge:8765
      AGENTFORGE_MCP_BRIDGE_TOKEN: ${MCP_BRIDGE_TOKEN:-local-demo-token}
    depends_on:
      db:
        condition: service_healthy
      mcp-bridge:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      AGENTFORGE_ENV: production
      AGENTFORGE_DATABASE_URL: postgresql+psycopg://agentforge:agentforge-demo@db:5432/agentforge
      AGENTFORGE_DEMO_MODE: "true"
      AGENTFORGE_LLM_BASE_URL: ${AGENTFORGE_LLM_BASE_URL:-}
      AGENTFORGE_LLM_API_KEY: ${AGENTFORGE_LLM_API_KEY:-}
      AGENTFORGE_LLM_MODEL: ${AGENTFORGE_LLM_MODEL:-gpt-4.1-mini}
      AGENTFORGE_LLM_EMBEDDING_MODEL: ${AGENTFORGE_LLM_EMBEDDING_MODEL:-text-embedding-3-small}
      AGENTFORGE_LLM_TRUST_ENV: ${AGENTFORGE_LLM_TRUST_ENV:-false}
      AGENTFORGE_MCP_BRIDGE_URL: http://mcp-bridge:8765
      AGENTFORGE_MCP_BRIDGE_TOKEN: ${MCP_BRIDGE_TOKEN:-local-demo-token}
    depends_on:
      db:
        condition: service_healthy
      mcp-bridge:
        condition: service_healthy
    restart: unless-stopped

  mcp-bridge:
    build:
      context: .
      dockerfile: mcp-servers/order-bridge/Dockerfile
    environment:
      MCP_BRIDGE_TOKEN: ${MCP_BRIDGE_TOKEN:-local-demo-token}
      MCP_BRIDGE_CONFIG: /app/bridge.config.json
      MCP_ORDER_HTTP_URL: http://mcp-order-http:8766/mcp
    depends_on:
      mcp-order-http:
        condition: service_healthy
    expose:
      - "8765"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8765/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  mcp-order-http:
    build:
      context: .
      dockerfile: mcp-servers/order-bridge/Dockerfile
    command: ["node", "/app/order-server/src/http-server.mjs"]
    environment:
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "8766"
    expose:
      - "8766"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8766/mcp').then(r=>process.exit(r.status===405?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  agentforge-postgres:

