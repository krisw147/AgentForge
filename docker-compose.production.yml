services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - agentforge-postgres:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      AGENTFORGE_ENV: production
      AGENTFORGE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AGENTFORGE_CORS_ORIGINS: ${PUBLIC_ORIGIN}
      AGENTFORGE_DEMO_MODE: "true"
      AGENTFORGE_LLM_BASE_URL: ${AGENTFORGE_LLM_BASE_URL}
      AGENTFORGE_LLM_API_KEY: ${AGENTFORGE_LLM_API_KEY}
      AGENTFORGE_LLM_MODEL: ${AGENTFORGE_LLM_MODEL}
      AGENTFORGE_LLM_EMBEDDING_MODEL: ${AGENTFORGE_LLM_EMBEDDING_MODEL}
      AGENTFORGE_LLM_TRUST_ENV: ${AGENTFORGE_LLM_TRUST_ENV:-false}
      AGENTFORGE_MCP_BRIDGE_URL: http://mcp-bridge:8765
      AGENTFORGE_MCP_BRIDGE_TOKEN: ${MCP_BRIDGE_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      mcp-bridge:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      AGENTFORGE_ENV: production
      AGENTFORGE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AGENTFORGE_DEMO_MODE: "true"
      AGENTFORGE_LLM_BASE_URL: ${AGENTFORGE_LLM_BASE_URL}
      AGENTFORGE_LLM_API_KEY: ${AGENTFORGE_LLM_API_KEY}
      AGENTFORGE_LLM_MODEL: ${AGENTFORGE_LLM_MODEL}
      AGENTFORGE_LLM_EMBEDDING_MODEL: ${AGENTFORGE_LLM_EMBEDDING_MODEL}
      AGENTFORGE_LLM_TRUST_ENV: ${AGENTFORGE_LLM_TRUST_ENV:-false}
      AGENTFORGE_MCP_BRIDGE_URL: http://mcp-bridge:8765
      AGENTFORGE_MCP_BRIDGE_TOKEN: ${MCP_BRIDGE_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      mcp-bridge:
        condition: service_healthy
    restart: unless-stopped

  mcp-bridge:
    build:
      context: .
      dockerfile: mcp-servers/order-bridge/Dockerfile
    environment:
      MCP_BRIDGE_TOKEN: ${MCP_BRIDGE_TOKEN}
      MCP_BRIDGE_CONFIG: /app/bridge.config.json
      MCP_ORDER_HTTP_URL: http://mcp-order-http:8766/mcp
    depends_on:
      mcp-order-http:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8765/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  mcp-order-http:
    build:
      context: .
      dockerfile: mcp-servers/order-bridge/Dockerfile
    command: ["node", "/app/order-server/src/http-server.mjs"]
    environment:
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "8766"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8766/mcp').then(r=>process.exit(r.status===405?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_ORIGIN}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - agentforge-caddy-data:/data
      - agentforge-caddy-config:/config
    restart: unless-stopped

volumes:
  agentforge-postgres:
  agentforge-caddy-data:
  agentforge-caddy-config:

